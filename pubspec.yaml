flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: assets/images/learnway_logo_pop.png
  image_path_ios: assets/images/learnway_logo_pop.jpg

android_notification_icons:
  image_path: "assets/images/ic_notification.png"
  icon_name: "ic_notification"

flutter_native_splash:
